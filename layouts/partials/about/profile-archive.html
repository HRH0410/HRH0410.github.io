{{ if eq .mode "profile" }}
<section class="profile-archive" id="about-profile-archive" aria-labelledby="about-archive-title">
  <header class="profile-archive__masthead">
    <span>Personal field notes</span>
    <span>File no. 0410</span>
    <span>Suzhou · 31.3°N</span>
  </header>

  <div class="profile-archive__layout">
    <figure class="profile-archive__portrait">
      <span class="profile-archive__tape" aria-hidden="true"></span>
      <img src="/img/author.jpg" alt="Steph.H" class="profile-archive__avatar nozoom" data-no-zoom="true">
      <figcaption>
        <small>digital wanderer</small>
      </figcaption>
    </figure>

    <div class="profile-archive__copy">
      <p class="profile-archive__eyebrow">你好，我是</p>
      <h2 id="about-archive-title">Steph.H</h2>
      <p class="profile-archive__lead">南京大学智能科学与技术专业的一名本科生。</p>
      <p>我喜欢把自己扔进各种新鲜事物里，也乐于探索技术与创意、理性与感受之间的交汇点。这些看似“不务正业”的尝试，恰恰构成了我理解世界、表达自己和创造东西的方式。</p>
      <p>这里收藏着学习、项目、旅行与生活留下的碎片——希望它们最终都能成为时间里可回望的痕迹。</p>
    </div>
  </div>
</section>
