<section class="skills-studio" id="skills-studio" data-skills-studio aria-label="Skills Studio">
  <div class="skills-studio__topline" aria-hidden="true">
    <span>STEPH's WORKBENCH</span>
    <span class="skills-studio__signal"><i></i><i></i><i></i></span>
    <span>SESSION ACTIVE</span>
  </div>

  <div class="skills-studio__grid">
    <article class="skill-station is-active" data-skill-station="code">
      <div class="skill-station__visual skill-station__visual--code" aria-hidden="true">
        <div class="studio-monitor">
          <picture>
            <source media="(prefers-reduced-motion: reduce)" srcset="/img/about/worlds/studio/coder-still.png">
            <img class="nozoom" data-no-zoom="true" src="/img/about/worlds/studio/coder.gif" alt="" loading="lazy" decoding="async">
          </picture>
          <span class="studio-monitor__scan"></span>
        </div>
        <span class="studio-led"></span>
      </div>
      <div class="skill-header" data-number="01">
        <button class="skill-label skill-station__switch" type="button" data-skill-trigger="code" aria-pressed="true">
          Code
        </button>
      </div>
      <div class="skill-items">
        <div class="skill-item">C / C++</div>
        <div class="skill-item">Python</div>
        <div class="skill-item">PyTorch</div>
        <div class="skill-item">Git</div>
      </div>
    </article>

    <article class="skill-station" data-skill-station="ai">
      <div class="skill-station__visual skill-station__visual--ai" aria-hidden="true">
        <img class="studio-workplace nozoom" data-no-zoom="true" src="/img/about/worlds/studio/ai-workplace.svg" alt="" loading="lazy" decoding="async">
        <span class="studio-thinking"><i></i><i></i><i></i></span>
      </div>
      <div class="skill-header" data-number="02">
        <button class="skill-label skill-station__switch" type="button" data-skill-trigger="ai" aria-pressed="false">
          AI Workflow
        </button>
      </div>
      <div class="skill-items">
        <div class="skill-item">Vibe Coding</div>
        <div class="skill-item">Prompt Engineering</div>
        <div class="skill-item">百炼 / Dify / Coze</div>
      </div>
    </article>

    <article class="skill-station" data-skill-station="create">
      <div class="skill-station__visual skill-station__visual--create" aria-hidden="true">
        <img class="studio-sandy nozoom" data-no-zoom="true" src="/img/about/worlds/studio/sandy-loading.svg" alt="" loading="lazy" decoding="async">
        <span class="studio-export-stamp">READY</span>
      </div>
      <div class="skill-header" data-number="03">
        <button class="skill-label skill-station__switch" type="button" data-skill-trigger="create" aria-pressed="false">
          Create
        </button>
      </div>
      <div class="skill-items">
        <div class="skill-item">视频剪辑</div>
        <div class="skill-item">美编设计</div>
      </div>
    </article>
  </div>

  <div class="skills-studio__status" aria-live="polite">
    <span class="skills-studio__status-mark" aria-hidden="true"></span>
    <span data-studio-status>BUILDING · 把想法变成可以运行的东西</span>
  </div>
</section>
