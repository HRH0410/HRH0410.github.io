{{ $tracks := site.Data.music }}

<script>
window.homePlaylist = [
  {{ range $i, $track := $tracks }}
  {{ if $i }},{{ end }}{
    title: {{ $track.title | jsonify | safeJS }},
    artist: {{ $track.artist | jsonify | safeJS }},
    cover: {{ $track.cover | jsonify | safeJS }},
    audio: {{ $track.audio | jsonify | safeJS }},
    color: {{ $track.color | default "#c9a227" | jsonify | safeJS }}
  }
  {{ end }}
];
</script>

<section class="record-player-section" aria-label="音乐播放器">
  <div class="record-player">
    <div class="turntable">
      <div class="plinth"></div>
      <div class="platter"></div>
      <div class="record" id="record">
        <div class="record-label" id="record-label" style="background-color: {{ (index $tracks 0).color | default "#c9a227" }}">
          <img id="record-cover" src="{{ (index $tracks 0).cover }}" alt="{{ (index $tracks 0).title }}">
        </div>
        <div class="record-spindle"></div>
      </div>
      <div class="tonearm" id="tonearm">
        <div class="tonearm-pivot"></div>
        <div class="tonearm-stick"></div>
        <div class="tonearm-head"></div>
      </div>
    </div>

    <div class="player-controls">
      <div class="player-track-info">
        <p id="player-track-title" class="player-track-title">{{ (index $tracks 0).title }}</p>
        <p id="player-track-artist" class="player-track-artist">{{ (index $tracks 0).artist }}</p>
      </div>

      <div class="player-progress">
        <span id="player-current-time" class="player-time">0:00</span>
        <div id="player-progress-bar" class="player-progress-bar">
          <div id="player-progress-fill" class="player-progress-fill"></div>
        </div>
        <span id="player-total-time" class="player-time">0:00</span>
      </div>

      <div class="player-buttons">
        <button id="player-prev" class="player-btn" aria-label="上一首">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
          </svg>
        </button>
        <button id="player-play" class="player-btn player-btn--play" aria-label="播放/暂停">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>
        <button id="player-next" class="player-btn" aria-label="下一首">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
